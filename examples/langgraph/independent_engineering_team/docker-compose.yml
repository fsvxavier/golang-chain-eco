# Every agent is its own container. Start order does not matter: workers retry
# until the hub is up and register again if they lose their lease.
#
#   cp .env.example .env            # add keys; leave empty to run offline
#   docker compose -f examples/langgraph/independent_engineering_team/docker-compose.yml up --build
#   docker compose -f ... run --rm client                  # sends the sample request
#   docker compose -f ... stop senior-1                    # kill a worker mid-run: its job moves to another
#
# Build context is the repository root.
x-build: &build
  context: ../../..
  dockerfile: examples/langgraph/independent_engineering_team/Dockerfile

x-env: &env
  env_file: [{ path: .env, required: false }]
  environment:
    HUB_URL: http://hub:8000

services:
  hub:
    build: { <<: *build, args: { SERVICE: hub } }
    env_file: [{ path: .env, required: false }]
    ports: ["${HUB_PORT:-8000}:8000"]            # GET /state shows workers and the queue

  manager:
    build: { <<: *build, args: { SERVICE: manager } }
    <<: *env
    depends_on: [hub]
    ports: ["${MANAGER_PORT:-8080}:8080"]            # Agent Server API (remote.Graph "engineering_team")

  client:
    build: { <<: *build, args: { SERVICE: client } }
    profiles: ["tools"]
    env_file: [{ path: .env, required: false }]
    environment: { MANAGER_URL: http://manager:8080 }
    depends_on: [manager]

  po:
    build: { <<: *build, args: { SERVICE: worker } }
    env_file: [{ path: .env, required: false }]
    environment: { HUB_URL: "http://hub:8000", WORKER_ID: po, WORKER_ROLE: po, WORKER_URL: "http://po:9000" }
    depends_on: [hub]
    restart: unless-stopped

  architect:
    build: { <<: *build, args: { SERVICE: worker } }
    env_file: [{ path: .env, required: false }]
    environment: { HUB_URL: "http://hub:8000", WORKER_ID: architect, WORKER_ROLE: architect, WORKER_URL: "http://architect:9000" }
    depends_on: [hub]
    restart: unless-stopped

  leader:
